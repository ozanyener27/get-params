<!DOCTYPE html>
<html lang="cs">
<body class="{{ color_theme }}">
    <form method="get" action="{{url_for('vzhled')}}">
        <label for="font_color">Barva písma:</label>
        <select name="font_color" id="font_color">
            <option
             value="red"
             {% if font_color == 'red' %} selected {% endif %}>
                >Červená</option>
            <option value="green" {% if font_color == 'green' %} selected {% endif %}>Zelená</option>
            <option value="blue" {% if font_color == 'blue' %} selected {% endif %}>Modrá</option>
        </select>
        <button type="submit">Použít</button>
    </form>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

     <style>

</head>
<body class="{{ color_theme }}">

        <select name="theme" id="color_theme">
            <option value="light">Světlé</option>
